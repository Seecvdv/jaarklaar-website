<!DOCTYPE html>
<html lang="nl">
<head>

  .box { max-width: 440px; }

  a {

    background: #6366f1; color: white; text-decoration: none;
    padding: 12px 28px; border-radius: 10px; font-weight: 700; font-size: 14px;
  }

</head>
<body>
  <div class="box">
    <div class="num">404</div>
