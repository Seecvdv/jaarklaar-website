<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Achtergrond -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Variant A: grote zachte cirkel rechtsboven (uit beeld) -->
  <circle cx="930" cy="330" r="450" fill="#EFF6FF"/>

  <!-- Variant A: kleinere echo rechtsonder -->
  <circle cx="840" cy="630" r="240" fill="#EFF6FF" opacity="0.7"/>

  <!-- Logo lockup: mark + woordmerk -->
  <rect x="80" y="80" width="60" height="60" rx="14" fill="#1D4ED8"/>
  <text x="110" y="112" text-anchor="middle" dominant-baseline="central"
        fill="#FFFFFF" font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="38" font-weight="800" letter-spacing="-1.5">J</text>
  <text x="160" y="110" dominant-baseline="central"
        fill="#0F172A" font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-0.76">Jaarklaar</text>

  <!-- Claim (twee regels) -->
  <text x="80" y="296" fill="#0F172A"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-2.52">Zelf je jaarrekening</text>
  <text x="80" y="374" fill="#0F172A"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-2.52">maken — zonder accountant</text>

  <!-- Indigo rule -->
  <rect x="80" y="448" width="60" height="4" rx="2" fill="#1D4ED8"/>

  <!-- Doelgroep-strip -->
  <text x="80" y="496" fill="#64748B"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="24" font-weight="500" letter-spacing="-0.12">Voor VvE · Stichting · Kleine BV · Micro · ZZP</text>
</svg>
